<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Directory — Michael Fitzpatrick</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌲%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bone:#F0EEE6;
    --paper:#FAF9F4;
    --ink:#1F1E1B;
    --faded:#6E675C;
    --clay:#C15F3C;
    --clay-deep:#A64E30;
    --hairline:#DCD6C8;
    --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    background:var(--bone); color:var(--ink);
    font-family:var(--serif); font-size:17px; line-height:1.65;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:32px;
  }
  a{color:var(--clay); text-decoration:none}
  a:hover{color:var(--clay-deep)}
  .plate{
    background:var(--paper); border:1px solid var(--hairline); border-radius:6px;
    padding:44px 40px; max-width:520px; width:100%; text-align:center;
  }
  .eyebrow{font-size:11px; letter-spacing:2px; text-transform:uppercase;
    color:var(--faded); font-weight:bold; margin-bottom:16px}
  h1{font-size:30px; line-height:1.15; letter-spacing:-.4px; margin-bottom:14px}
  p{color:var(--faded); margin-bottom:14px}
  p:last-child{margin-bottom:0}
  .sprig{margin:0 auto 22px; display:block; fill:var(--clay); opacity:.55}
  .rule{height:1px; background:var(--hairline); margin:26px 0}
  .back{font-size:14px}
  @media (max-width:600px){
    body{font-size:16px; padding:22px}
    .plate{padding:32px 24px}
    h1{font-size:25px}
  }
</style>
</head>
<body>

<div class="plate">
  <svg class="sprig" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M12 2.5 8.2 8.4h2.2L6.4 14h2.6l-3.2 4.8h5.1V22h2.2v-3.2h5.1L14.9 14h2.6l-4-5.6h2.2L12 2.5z"/></svg>
  <div class="eyebrow">Private Index</div>
  <h1>Nothing to see here</h1>
  <p>This is a private index of work-in-progress and archived pages. It is not published and it is not linked.</p>
  <div class="rule"></div>
  <p class="back"><a href="/">Return to michaelfitzpatrick.me</a></p>
</div>

</body>
</html>
